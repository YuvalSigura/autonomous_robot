version: '3.8'

services:
  autonomous_robot:
    build: .
    container_name: autonomous_robot
    runtime: nvidia
    network_mode: host
    privileged: true
    volumes:
      - /tmp/argus_socket:/tmp/argus_socket
      - /dev:/dev
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiochip0
      - /dev/gpiochip1
      - /dev/gpiochip2
      - /dev/gpiochip3

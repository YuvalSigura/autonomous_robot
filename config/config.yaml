camera:
  device_index: 0
  resolution:
    width: 640
    height: 480
  frame_rate: 30

robot:
  wheelbase_m: 0.20
  track_width_m: 0.18
  max_command: 0.35
  settle_before_rf_s: 0.75
  wheel_polarity:
    front_left: 1
    front_right: 1
    rear_left: 1
    rear_right: 1

motor_controller:
  port: /dev/ttyUSB0
  baudrate: 115200
  watchdog_ms: 500
  require_explicit_arm: true

navigation:
  waypoint_tolerance_m: 0.12
  heading_tolerance_rad: 0.20
  linear_gain: 0.8
  angular_gain: 1.2
  max_linear_command: 0.30
  max_angular_command: 0.30
  aruco:
    marker_length_m: 0.16
    target_distance_m: 0.55
    distance_tolerance_m: 0.08
    lateral_tolerance_m: 0.06
    forward_gain: 0.8
    lateral_gain: 1.0
    yaw_gain: 0.8
    max_forward: 0.22
    max_lateral: 0.18
    max_yaw: 0.20

rf:
  # Placeholder until HackRF integration. The non-RF robot stack does not depend on it.
  backend: simulated
  simulated_beacon:
    x_m: 3.0
    y_m: 2.0
    tx_power_db: -20.0
    path_loss_exponent: 2.0
    noise_std_db: 1.5
  search:
    step_m: 0.5
    exploration_weight: 0.20
    stop_radius_m: 0.5

model:
  path: data/models/model_best.pth
  input_size:
    width: 224
    height: 224

logging:
  level: DEBUG
  log_to_file: true
  log_file_path: logs/runtime_logs.txt
